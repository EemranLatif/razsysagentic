[project]
name = "test123"
version = "0.1.0"
description = "test123 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
test123 = "test123.main:run"
run_crew = "test123.main:run"
train = "test123.main:train"
replay = "test123.main:replay"
test = "test123.main:test"
run_with_trigger = "test123.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
